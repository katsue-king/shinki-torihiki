  function call(fn, args, ok, ng){
    fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({api:fn, args:args})})

      .catch(function(e){ if (ng) ng(e); else console.error(e); });
  }
  function runner(ok, ng){
    return new Proxy({}, {get:function(t, p){
      if (p === 'withSuccessHandler') return function(f){ return runner(f, ng); };
      if (p === 'withFailureHandler') return function(f){ return runner(ok, f); };
      return function(){ call(p, Array.prototype.slice.call(arguments), ok, ng); };
    }});
  }
  window.google = {script:{
    run: runner(null, null),
    url: {getLocation:function(cb){ var o = {}; new URLSearchParams(location.search).forEach(function(v,k){ o[k] = v; }); cb({parameter:o}); }}
  }};
})();

// ===== 画面を組み立てる =====
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let photoData=null;
function fieldHTML(f){
  const id='f_'+f.k, lab=esc(f.label||f.k)+(f.req?'<b>必須</b>':'');
  let inner='';
  if(f.type==='radio'||f.type==='multi'){
    const t=f.type==='radio'?'radio':'checkbox';

function costCalc(get) {
  const num = k => { const n = Number(String(get(k) || '').replace(/[,，円個食回\s]/g, '')); return isFinite(n) ? n : 0; };
  const has = (k, o) => String(get(k) || '').split('・').indexOf(o) >= 0;
  const SV = [['寸胴みそ汁', 8, 16], ['練りみそ', 4, 17], ['ふりかけ', 4, 18], ['醤油ソース', 2, 19], ['お茶', 8, 21]];
  const items = SV.map(([name, yen, row]) => ({ name: name, yen: yen, row: row, on: has('原価_サービス品', name) || (name === '醤油ソース' && has('原価_サービス品', '醤油')) }));
  const course = String(get('特別食_契約コース') || '');
  const m = /月(\d+)回/.exec(course);
  const times = m ? +m[1] : (course === '個別' ? num('原価_月回数') : 0);
  const sp = times * 6;
  const s1 = items.reduce((a, i) => a + (i.on ? i.yen : 0), 0) + sp;
  const okazu = get('原価_おかず') || '', rice = get('原価_ライス') || '';
  const okazuYen = okazu === '特' ? 92 : okazu === 'R' ? 97 : 0;
  const riceYen = rice === '並' ? 35 : rice === '大' ? 39 : 0;
  const s2 = okazuYen + riceYen, total = s1 + s2;
  const raw = num('単価_セット');
  const net = raw ? (get('税区分') === '税別' ? raw : Math.floor(raw / 1.08)) : 0;
  const qty = num('基本個数');
  const unitProfit = net ? net - total : 0;
  const sales = net * qty, cost = total * qty, profit = sales - cost;
  const rate = net ? total / net : 0;
  const rank = (net && qty) ? (rate < 0.37 ? (profit >= 4000 ? 'A' : 'C') : (profit >= 4000 ? 'B' : 'D')) : '';
  return { items: items, times: times, sp: sp, s1: s1, okazu: okazu, okazuYen: okazuYen, rice: rice, riceYen: riceYen, s2: s2, total: total,
    raw: raw, net: net, taxIn: get('税区分') !== '税別', qty: qty, unitProfit: unitProfit, sales: sales, cost: cost, profit: profit, rate: rate, rank: rank };
}
function getVal(k){
  const els=document.getElementsByName(k);
  if(!els.length) return '';
  if(els[0].type==='radio'){const c=[...els].find(e=>e.checked);return c?c.value:'';}
  if(els[0].type==='checkbox'){return [...els].filter(e=>e.checked).map(e=>e.value).join('・');}
  return els[0].value.trim();
}
function setVal(k,v){
  const els=document.getElementsByName(k); if(!els.length) return;
  if(els[0].type==='radio') els.forEach(e=>e.checked=e.value===v);
  else if(els[0].type==='checkbox'){const a=String(v).split('・');els.forEach(e=>e.checked=a.includes(e.value));}
  else els[0].value=v;
}
function applyIf(){

}

  if(!GRUN()){m.textContent='（お試し版のため送れません）';return;}
  m.textContent='送っています…';
  google.script.run.withSuccessHandler(()=>{
    setVal('合言葉',c);try{localStorage.setItem('shinki_pass',c);localStorage.setItem('shinki_code',c);}catch(e){}
    document.getElementById('regBox').remove();whoAmI();toast('申し込みました。勝江さんの承認をお待ちください');
  }).withFailureHandler(e=>{m.innerHTML='<b style="color:var(--warn)">'+esc(e.message||e)+'</b>';}).registerStaff(n,c,r);
}
// 合言葉はこのスマホに記憶
try{const pc=localStorage.getItem('shinki_pass')||localStorage.getItem('shinki_code');if(pc)setVal('合言葉',pc);}catch(e){}
document.getElementsByName('合言葉')[0].addEventListener('change',e=>{try{localStorage.setItem('shinki_pass',e.target.value.trim());}catch(_){}whoAmI();});
if(window.google&&google.script&&google.script.run) google.script.run.withSuccessHandler(a=>{$('#courses').innerHTML=(a||[]).map(c=>`<option value="${esc(c)}">`).join('');}).getCourses();
whoAmI(); loadDraft(); if(getVal('GoogleマップURL'))showMapView({url:getVal('GoogleマップURL')}); applyIf();
</script>

<style>

  #sugBox{border:1px solid var(--acc);border-radius:10px;margin-top:6px;background:#fff;overflow:hidden}

  #eFoot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
  #eFoot button{flex:1;font-size:16px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff}

  #eFoot[hidden],#eigyo[hidden],#sugBox[hidden],#camBox[hidden]{display:none}

  .camBtns button,.camBtns .lbtn{flex:1 1 40%;font-size:16px;padding:14px;border-radius:12px;border:1px solid #666;background:#222;color:#fff;text-align:center}
  .camBtns .shoot{flex:1 1 100%;background:#fff;color:#000;font-weight:bold;font-size:18px}
  #eigyo .mcard{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
  #eigyo .mcard:first-child{border-top:0}
  #eigyo .mthumbs{display:flex;gap:6px;margin-bottom:6px}

  #bigBox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
  #bigBox[hidden]{display:none}
  #bigBox img{max-width:100%;max-height:100%}
  #eigyo .nday{display:flex;gap:6px;align-items:center}
  #eigyo .nday input{flex:1}
  #eigyo .nday button{font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}

  @media print{ header,#tabs,#eFoot,#eigyo .big,#eigyo .nday,.noprint{display:none!important} #eigyo{padding:0} #eigyo section{break-inside:avoid;border:1px solid #999} body{background:#fff} }
</style>
<main id="eigyo" hidden></main>
<div id="bigBox" hidden onclick="this.hidden=true"></div>
<div id="eFoot" hidden><button onclick="eHome()">一覧へ戻る</button><button class="main" onclick="eSave()">登録する</button></div>
<div id="camBox" hidden><div id="camTitle"></div><video id="camVideo" playsinline muted></video>
<div id="camHint" hidden>このスマホでは画面の中でカメラを使えません。下の「カメラで撮る」を押してください。</div>
<div class="camBtns"><button id="camShot" class="shoot" onclick="camShot()">撮る</button>
<label class="lbtn">カメラで撮る<input type="file" accept="image/*" capture="environment" onchange="camFile(this)" hidden></label>
<label class="lbtn">写真から選ぶ<input type="file" accept="image/*" onchange="camFile(this)" hidden></label>

<script>
// ----- タブ（新規申請／新規営業） -----
(function(){
  const nav=document.createElement('nav'); nav.id='tabs';
  nav.innerHTML='<button data-t="s" class="on">新規申請</button><button data-t="e">新規営業</button>';
  document.querySelector('header').after(nav);
  nav.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b)eTab(b.dataset.t);});
  const h=document.createElement('input');h.type='hidden';h.name='営業先ID';document.getElementById('form').appendChild(h);
})();
function eTab(t){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const e=t==='e';
  document.getElementById('form').hidden=e; document.getElementById('foot').style.display=e?'none':'';
  document.getElementById('eigyo').hidden=!e; document.getElementById('eFoot').hidden=true;
  document.querySelector('header h1').textContent=e?'新規営業':'新規取引申請書';
  if(e) eHome();
  window.scrollTo(0,0);
}
const E={list:[],cur:null,img:'',second:false,card:null};
const P2=['部署','担当者名','役職','電話','携帯','メール'];
const eCode=()=>getVal('合言葉')||(()=>{try{return localStorage.getItem('shinki_code')||'';}catch(e){return '';}})();
const eRun=(fn,...a)=>new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>ng(e))[fn](...a));
const eEsc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CF=[['会社名','text'],['フリガナ','text'],['部署','text'],['担当者名','text'],['役職','text'],['郵便番号','tel'],['住所','text'],['電話','tel'],['FAX','tel'],['携帯','tel'],['メール','email']];
const RF=[
 {h:'今日の営業の記録'},
 {k:'訪問日',t:'date'},
 {k:'話した内容',t:'area'},{k:'次にやること',t:'area'},{k:'次の訪問予定日',t:'date'},
 {k:'見込み',t:'radio',o:['A（取れそう）','B（五分五分）','C（むずかしい）']},
 {h:'今の弁当の様子'},
 {k:'今の弁当業者',t:'text',l:'今どこの弁当か'},{k:'今の単価',t:'text',ph:'例：税込480円'},{k:'今の食数',t:'text',ph:'例：1日30食'},
 {k:'今の特別食',t:'area',l:'今の特別食の内容'},{k:'不満・要望',t:'area'},
 {h:'提案した内容'},
 {k:'勧めた弁当',t:'text'},{k:'提案した単価',t:'text'},{k:'試食',t:'radio',o:['渡した','渡していない']},
];
function eField(k,t,val,label,ph,opts){
  const id='e_'+k;
  let inp;
  if(t==='area') inp=`<textarea id="${id}">${eEsc(val)}</textarea>`;
  else if(t==='radio') inp='<div class="chips">'+opts.map(o=>`<label><input type="radio" name="${id}" value="${eEsc(o)}"${val===o?' checked':''}><span>${eEsc(o)}</span></label>`).join('')+'</div>';
  else inp=`<input type="${t}" id="${id}" value="${eEsc(val)}" placeholder="${eEsc(ph||'')}">`;
  return `<div class="f"><label>${eEsc(label||k)}</label>${inp}</div>`;
}
function eVal(k){const r=document.querySelector(`input[name="e_${k}"]:checked`);if(r)return r.value;const el=document.getElementById('e_'+k);return el?el.value.trim():'';}
async function eHome(){
  E.cur=null;E.img='';E.second=false;E.card=null;
  document.getElementById('eFoot').hidden=true;
  const m=document.getElementById('eigyo');
  const code=eCode();
  if(!code){m.innerHTML=`<section><h2>合言葉</h2><div class="body"><div class="f"><label>自分の合言葉</label><input type="text" id="eCodeIn"></div><button class="big" onclick="eSetCode()">はじめる</button></div></section>`;return;}
  m.innerHTML=`<button class="big" onclick="eShoot(false)">&#x1F4F7; 名刺を撮る（新しい会社）</button><button class="big sub" onclick="eEdit(null)">名刺なしで会社を登録する</button><button class="big sub" onclick="eCardList()">&#x1F4C7; 名刺一覧・さがす</button><button class="big sub" onclick="eNippo()">&#x1F4CB; 日報</button><section><h2>自分の営業先 <small id="eCnt"></small></h2><div class="body" id="eList"><div class="hint">読み込み中…</div></div></section>`;
  try{
    E.list=await eRun('eigyoList',code);
    document.getElementById('eCnt').textContent=E.list.length+'件';
    document.getElementById('eList').innerHTML=E.list.length?E.list.map((r,i)=>`<div class="row" onclick="eOpen('${eEsc(r.id)}')"><div><b>${eEsc(r.会社名)}</b><small style="display:block;color:var(--sub)">${eEsc(r.担当者名||'')}　最終訪問 ${eEsc(r.最終訪問日||'')}${r.営業担当?'　'+eEsc(r.営業担当):''}</small></div><div>${r.見込み?`<span class="tag ${eEsc(r.見込み.charAt(0))}">${eEsc(r.見込み.charAt(0))}</span>`:''}<span class="tag ${eEsc(r.状態)}">${eEsc(r.状態)}</span></div></div>`).join(''):'<div class="hint">まだありません。名刺を撮って登録してください。</div>';
  }catch(e){document.getElementById('eList').innerHTML='<div class="hint">'+eEsc(e.message||e)+'</div>';}
}
function eSetCode(){const v=document.getElementById('eCodeIn').value.trim();if(!v)return;setVal('合言葉',v);try{localStorage.setItem('shinki_code',v);}catch(e){}saveDraft(false);eHome();}
function eShoot(second){E.second=second;E.front=null;camOpen('表');}
// ----- カメラ（その場で撮る。だめなときはスマホのカメラ／写真を選ぶ）-----
let camStream=null, camSide='表';
function camOpen(side){
  camSide=side;
  const b=document.getElementById('camBox');
  document.getElementById('camTitle').textContent=side==='表'?'名刺の表面を撮ってください':'裏面を撮ってください（裏が白紙なら「裏面なし」）';
  document.getElementById('camSkip').hidden=side==='表';
  b.hidden=false;
  if(camStream) return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){camFallback();return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})
   .then(s=>{camStream=s;const v=document.getElementById('camVideo');v.srcObject=s;v.play();})
   .catch(()=>camFallback());
}
function camFallback(){document.getElementById('camVideo').hidden=true;document.getElementById('camShot').hidden=true;document.getElementById('camHint').hidden=false;}
function camClose(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}document.getElementById('camBox').hidden=true;document.getElementById('camVideo').hidden=false;document.getElementById('camShot').hidden=false;document.getElementById('camHint').hidden=true;}
function camShot(){
  const v=document.getElementById('camVideo'); if(!v.videoWidth) return;
  const s=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight)),cv=document.createElement('canvas');
  cv.width=v.videoWidth*s;cv.height=v.videoHeight*s;cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
  camGot(cv.toDataURL('image/jpeg',0.85));
}
function camFile(input){
  const file=input.files[0]; input.value=''; if(!file) return;
  const img=new Image();
  img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);camGot(cv.toDataURL('image/jpeg',0.85));};
  img.src=URL.createObjectURL(file);
}
function camGot(data){
  if(camSide==='表'){E.front=data;camOpen('裏');toast('表面を撮りました。次は裏面です');}
  else camDone(data);
}
async function camDone(back){
  camClose();
  const front=E.front; if(!front) return;
  toast('名刺を読み取っています…（10〜20秒）');
  try{
    const r=await eRun('eigyoOcr',eCode(),front,back||'');
    E.img=r.imageUrl; E.card={front:r.front,back:r.back||'',frontId:r.frontId,backId:r.backId||'',meishiId:r.meishiId||''}; E.fData=front; E.bData=back||'';
    if(E.second&&E.cur){ eShowSecond(front,back,r.fields); toast('2枚目の名刺を読み取りました。内容を確かめてください'); }
    else { eEdit(null,r.fields,front,null,back); toast('読み取りました（名刺一覧にも入りました）。まちがいを直してから登録してください'); }
  }catch(e){toast('読み取れませんでした：'+(e.message||e)); if(!E.second) eEdit(null,{},front,null,back);}
}
function eShowSecond(front,back,f){
  const b=document.getElementById('eCard'); if(!b) return; f=f||{};
  b.innerHTML='<div class="warn" style="background:#eef4fb;border-color:#a9c4e4"><b>この会社の名刺を足します</b><div class="mthumbs" style="margin-top:8px">'+(front?`<img src="${front}">`:'')+(back?`<img src="${back}">`:'')+'</div>'+P2.map(k=>`<div class="f"><label>${k}（この名刺）</label><input type="${/電話|携帯/.test(k)?'tel':k==='メール'?'email':'text'}" id="e2_${k}" value="${eEsc(f[k]||'')}"></div>`).join('')+'</div>';
}
async function eBig(fid){
  if(!fid) return; const bx=document.getElementById('bigBox'); bx.innerHTML='読み込み中…'; bx.hidden=false;
  try{ const u=await eRun('eigyoCardImage',eCode(),fid); bx.innerHTML=`<img src="${u}">`; }catch(e){ bx.innerHTML=eEsc(e.message||e); }
}
function eCardsHtml(cards){
  if(!cards||!cards.length) return '';
  return `<section><h2>名刺<small>${cards.length}枚</small></h2><div class="body">`+cards.map(c=>`<div class="mcard"><div class="mthumbs">${c.frontThumb?`<img src="${c.frontThumb}" onclick="eBig('${eEsc(c.frontId)}')">`:''}${c.backThumb?`<img src="${c.backThumb}" onclick="eBig('${eEsc(c.backId)}')">`:''}</div><b>${eEsc(c.担当者名||'（名前なし）')}</b> ${eEsc([c.部署,c.役職].filter(Boolean).join(' '))}<small style="display:block;color:var(--sub)">${eEsc([c.携帯&&'携帯 '+c.携帯,c.電話&&'電話 '+c.電話,c.メール].filter(Boolean).join('　'))}</small><small style="display:block;color:var(--sub)">もらった日 ${eEsc(c.もらった日)}　${eEsc(c.営業担当)}</small></div>`).join('')+'</div></section>';
}
let nDay='';
async function eNippo(day){
  document.getElementById('eFoot').hidden=true;
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  nDay=day||nDay||today;
  const m=document.getElementById('eigyo');
  m.innerHTML=`<button class="big sub" onclick="eHome()">← 戻る</button><section><h2>営業日報</h2><div class="body"><div class="nday"><button onclick="eNippoMove(-1)">◀ 前の日</button><input type="date" id="nDayIn" value="${nDay}" onchange="eNippo(this.value)"><button onclick="eNippoMove(1)">次の日 ▶</button></div></div></section><div id="nRes"><div class="hint">読み込み中…</div></div><button class="big sub noprint" onclick="window.print()">&#x1F5A8; 印刷する</button>`;
  try{
    const r=await eRun('eigyoNippo',eCode(),nDay.replace(/-/g,'/'));
    const tot=r.groups.reduce((a,g)=>a+g.recs.length,0);
    document.getElementById('nRes').innerHTML=`<div class="hint" style="margin:6px 2px">${eEsc(r.day)}　訪問 ${tot}件</div>`+(r.groups.length?r.groups.map(g=>`<section><h2>${eEsc(g.name)}<small>${g.recs.length?'訪問'+g.recs.length+'件':'記録なし'}${g.newCompanies?'・新しい会社'+g.newCompanies:''}${g.cards?'・名刺'+g.cards+'枚':''}</small></h2><div class="body">${g.recs.map(x=>`<div class="nrec" onclick="eOpen('${eEsc(x.id)}')"><b>${eEsc(x.会社名)}</b>${x.見込み?`<span class="tag ${eEsc(x.見込み.charAt(0))}">${eEsc(x.見込み.charAt(0))}</span>`:''}${x.新規?'<span class="tag">新</span>':''}${['話した内容','次にやること','次の訪問予定日','今の弁当業者','提案した単価','試食'].filter(k=>x[k]).map(k=>`<div style="white-space:pre-wrap"><small style="color:var(--sub)">${k}</small>　${eEsc(x[k])}</div>`).join('')}</div>`).join('')||'<div class="hint">この日の営業の記録はありません</div>'}</div></section>`).join(''):'<div class="hint">この日の営業の記録はありません</div>');
  }catch(e){document.getElementById('nRes').innerHTML='<div class="hint">'+eEsc(e.message||e)+'</div>';}
  window.scrollTo(0,0);
}
function eNippoMove(n){const d=new Date(nDay+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);eNippo(d.toISOString().slice(0,10));}
// 日報のLINEのリンク（?nippo=1&k=合言葉）から開いたとき
(function(){
  const q=new URLSearchParams(location.search);
  if(!q.get('nippo')) return;
  const k=q.get('k'); if(k){ setVal('合言葉',k); try{localStorage.setItem('shinki_code',k);}catch(e){} }
  setTimeout(()=>{ eTab('e'); eNippo(); },300);
})();
async function eOpenCard(mid){
  toast('名刺を開いています…');
  try{
    const r=await eRun('eigyoCardGet',eCode(),mid);
    E.second=false; E.img=r.imageUrl; E.card={front:r.front,back:r.back||'',frontId:r.frontId,backId:r.backId||'',meishiId:r.meishiId}; E.fData=r.frontData; E.bData=r.backData||'';
    eEdit(null,r.fields,r.frontData,null,r.backData||'');
    toast('まちがいを直してから登録してください');
  }catch(e){toast(e.message||e);}
}
async function eCardList(){
  document.getElementById('eFoot').hidden=true;
  const m=document.getElementById('eigyo');
  m.innerHTML=`<button class="big sub" onclick="eHome()">← 戻る</button><section><h2>名刺一覧</h2><div class="body"><div class="f"><label>名前・会社名でさがす</label><input type="search" id="eCardQ" placeholder="例：山田、テスト精工"></div><div id="eCardRes"><div class="hint">読み込み中…</div></div></div></section>`;
  const q=document.getElementById('eCardQ'); let t=null;
  const load=async()=>{ const box=document.getElementById('eCardRes'); try{ const r=await eRun('eigyoCards',eCode(),q.value.trim()); box.innerHTML=r.length?r.map(c=>`<div class="row" onclick="${c.id?`eOpen('${eEsc(c.id)}')`:`eOpenCard('${eEsc(c.mid)}')`}"><div>${c.状態==='未登録'?'<span class="tag A" style="margin:0 6px 0 0">未登録</span>':''}<b>${eEsc(c.担当者名||'（名前なし）')}</b> <small>${eEsc(c.役職||'')}</small><small style="display:block;color:var(--sub)">${eEsc(c.会社名)}　${eEsc(c.携帯||c.電話||'')}</small></div><small style="color:var(--sub)">${eEsc(c.もらった日)}</small></div>`).join(''):'<div class="hint">見つかりません</div>'; }catch(e){ box.innerHTML='<div class="hint">'+eEsc(e.message||e)+'</div>'; } };
  q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(load,400);});
  load(); window.scrollTo(0,0);
}
async function eOpen(id){
  try{ const r=await eRun('eigyoGet',eCode(),id); eEdit(r.company,null,null,r.records,null,r.cards); }
  catch(e){toast(e.message||e);}
}
function eEdit(company,fields,img,records,back,cards){
  E.cur=company;
  const v=Object.assign({},fields||{},company||{});
  const m=document.getElementById('eigyo');
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  m.innerHTML=
   `<section><h2>${company?eEsc(company.会社名):'会社の情報'}<small>${company?eEsc(company.状態):'名刺の読み取り結果を確かめてください'}</small></h2><div class="body">
     <div id="eCard">${img?`<img class="card" src="${img}">`:''}${back?`<img class="card" src="${back}">`:''}</div>
     ${company?`<button class="big sub" onclick="eShoot(true)">&#x1F4F7; 名刺をもう1枚撮る</button>`:''}
     ${CF.map(([k,t])=>eField(k,t,v[k]||'')).join('')}
     <div id="eDup"></div><div id="eArea"></div>
     ${company?eField('状態','radio',company.状態,'状態',null,['訪問済み','申請中','契約済み','見送り']):''}
     ${company&&company.状態!=='契約済み'?`<button class="big sub" onclick="eToShinsei()">この会社で新規取引申請書を作る</button>`:''}
   </div></section>
   ${eCardsHtml(cards)}
   <section><h2>今日の営業の記録</h2><div class="body">${RF.map(f=>f.h?(f.h==='今日の営業の記録'?'':`<h3 style="font-size:15px;color:var(--acc);margin:18px 0 0">${f.h}</h3>`):eField(f.k,f.t,f.k==='訪問日'?today:'',f.l,f.ph,f.o)).join('')}</div></section>
   ${records&&records.length?`<section><h2>これまでの記録<small>${records.length}回</small></h2><div class="body">${records.map(r=>`<div class="rec"><b>${eEsc(r.訪問日)}</b>　${eEsc(r.見込み||'')}　${eEsc(r.営業担当||'')}\n${['話した内容','次にやること','次の訪問予定日','今の弁当業者','今の単価','今の食数','今の特別食','不満・要望','勧めた弁当','提案した単価','試食'].filter(k=>r[k]).map(k=>k+'：'+eEsc(r[k])).join('\n')}</div>`).join('')}</div></section>`:''}`;
  document.getElementById('eFoot').hidden=false;
  const nameEl=document.getElementById('e_会社名');
  if(!company){ nameEl.addEventListener('change',eDup); if(v.会社名) eDup(); }
  const adEl=document.getElementById('e_住所');
  const eAreaCheck=()=>{const a=eVal('住所');if(a) areaRun('checkAreaByAddress',[eCode(),a],document.getElementById('eArea'));};
  if(adEl){ adEl.addEventListener('change',eAreaCheck); if(v.住所) eAreaCheck(); }
  window.scrollTo(0,0);
}
async function eDup(){
  const n=eVal('会社名'), box=document.getElementById('eDup'); if(!box) return;
  box.innerHTML='';
  if(n.length<2) return;
  try{
    const r=await eRun('eigyoClassify',eCode(),n);
    let h='';
    if(r.torihiki&&r.torihiki.length) h+='<div class="warn" style="background:#fde7e2;border-color:#e8a08f"><b>もう取引がある得意先かもしれません</b><br>'+r.torihiki.map(x=>`${eEsc(x.顧客名)}（${eEsc(x.コース)}）`).join('<br>')+'<div class="hint">同じ会社なら、営業先として登録しなくて大丈夫です。別の事業所などなら、そのまま登録してください。</div></div>';
    if(!h&&!r.mine.length&&!r.others.length) h='<div class="warn" style="background:#e7f2ec;border-color:#9cc9b2">取引も営業先リストもない、新しい会社です。</div>';
    if(r.mine.length) h+='<div class="warn">似た会社がもう登録されています。同じ会社なら選んでください（記録と名刺がその会社に足されます）。'+r.mine.map(x=>`<button class="big sub" onclick="eMerge('${eEsc(x.id)}')">${eEsc(x.会社名)}${x.担当者名?'（'+eEsc(x.担当者名)+'）':''} に足す</button>`).join('')+'<div class="hint">別の会社なら、そのまま登録してください。</div></div>';
    if(r.others.length) h+='<div class="warn">'+r.others.map(x=>`「${eEsc(x.会社名)}」は ${eEsc(x.営業担当)}さんが登録済みです。`).join('<br>')+'<br>同じ会社なら、先に相談してください。</div>';
    box.innerHTML=h;
  }catch(e){}
}
async function eMerge(id){
  const keep={};CF.forEach(([k])=>keep[k]=eVal(k));const img=E.img,card=E.card,fd=E.fData,bd=E.bData;
  const r=await eRun('eigyoGet',eCode(),id);
  eEdit(r.company,null,null,r.records,null,r.cards);
  E.second=true; E.img=img; E.card=card;
  CF.forEach(([k])=>{const el=document.getElementById('e_'+k); if(el&&!el.value&&keep[k]) el.value=keep[k];});
  if(card) eShowSecond(fd,bd,keep);
  toast('「'+r.company.会社名+'」に足します。記録を書いて登録してください');
}
async function eSave(){
  const company={};CF.forEach(([k])=>company[k]=eVal(k));
  if(!company.会社名){toast('会社名を入れてください');return;}
  const record={};RF.forEach(f=>{if(f.k)record[f.k]=eVal(f.k);});
  const p={id:E.cur?E.cur.営業先ID:'',company:company,record:record,imageUrl:E.img||''};
  if(E.cur&&eVal('状態')&&eVal('状態')!==E.cur.状態) p['状態']=eVal('状態');
  if(E.card){ const info={}; P2.forEach(k=>{ const el=document.getElementById('e2_'+k); info[k]=el?el.value.trim():(company[k]||''); }); p.card=Object.assign({},E.card,{info:info}); }
  if(E.cur&&E.second) p.secondCard=true;
  const btn=document.querySelector('#eFoot .main'); btn.disabled=true; btn.textContent='登録中…';
  try{ await eRun('eigyoSave',eCode(),p); toast('登録しました'); eHome(); }
  catch(e){ toast('登録できませんでした：'+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent='登録する'; }
}
function eToShinsei(){
  const c={};CF.forEach(([k])=>c[k]=eVal(k));
  eTab('s'); eFillShinsei(Object.assign({営業先ID:E.cur.営業先ID},c));
}
function eFillShinsei(c){
  const map={'得意先名':'会社名','フリガナ':'フリガナ','得意先担当者':'担当者名','役職':'役職','TEL':'電話','FAX':'FAX','納品先郵便番号':'郵便番号','納品先住所':'住所'};
  Object.entries(map).forEach(([to,from])=>{ if(c[from]) setVal(to,c[from]); });
  setVal('営業先ID',c.営業先ID||c['営業先ID']||'');
  applyIf(); saveDraft(false);
  toast('営業先リストの内容を入れました。地図・停車位置などを足してください');
}
// ----- 申請書の得意先名：2〜3文字で営業先リストから候補 -----
(function(){
  const inp=document.getElementsByName('得意先名')[0]; if(!inp) return;
  const box=document.createElement('div'); box.id='sugBox'; box.hidden=true; inp.after(box);
  let t=null, hits=[];
  inp.addEventListener('input',()=>{
    setVal('営業先ID','');
    clearTimeout(t); const q=inp.value.trim(); if(q.length<2){box.hidden=true;return;}
    t=setTimeout(async()=>{
      try{
        hits=await eRun('eigyoSuggest',eCode(),q);
        if(!hits.length){box.hidden=true;return;}
        box.innerHTML='<div style="background:var(--acc2);font-size:13px;color:var(--acc)">営業先リストから選ぶ</div>'+hits.map((h,i)=>`<div data-i="${i}"><b>${eEsc(h.会社名)}</b><small>${eEsc([h.担当者名,h.住所].filter(Boolean).join('　'))}</small></div>`).join('');
        box.hidden=false;
      }catch(e){box.hidden=true;}
    },400);
  });
  box.addEventListener('click',ev=>{const d=ev.target.closest('[data-i]');if(!d)return;eFillShinsei(hits[+d.dataset.i]);box.hidden=true;});
  document.addEventListener('click',ev=>{if(!box.contains(ev.target)&&ev.target!==inp)box.hidden=true;});
})();
</script>
</body>
